services:
  - type: web
    name: postsheet-h4h-ps1
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: "production"
      - key: PORT
        value: "8788"
      - key: PS1_PORT
        value: "8788"
      - key: PS1_BIND
        value: "0.0.0.0"
      - key: PS1_DEMO_AUTH
        value: "1"
      - key: PS1_TRUST_PROXY
        value: "1"
      - key: PS1_SQLITE_PATH
        value: "/tmp/seed-event.sqlite"
      - key: PS1_AUTH_SECRET
        generateValue: true
