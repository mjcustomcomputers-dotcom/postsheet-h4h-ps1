services:
  postsheet-h4h-ps1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: postsheet-h4h-ps1-hardened
    read_only: true
    tmpfs:
      - "/tmp:rw,noexec,nosuid,size=32m"
    cap_drop:
      - "ALL"
    security_opt:
      - "no-new-privileges:true"
    pids_limit: 128
    mem_limit: 512m
    cpus: 1.0
    ports:
      - "127.0.0.1:8788:8788"
    environment:
      NODE_ENV: "production"
      PS1_BIND: "0.0.0.0"
      PS1_PORT: "8788"
      PS1_SQLITE_PATH: "/data/seed-event.sqlite"
      PS1_DEMO_AUTH: "1"
      PS1_TRUST_PROXY: "1"
    volumes:
      - ps1_sqlite_data:/data
    restart: unless-stopped

volumes:
  ps1_sqlite_data:
